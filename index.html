<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Resize Foto Jernih</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        input[type="file"], select { margin: 15px 0; width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #0051d5; }
        #loading { display: none; margin-top: 10px; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>Resize Resolusi Foto (Jernih)</h2>
    <p>Pilih foto dan tentukan ukuran lebarnya.</p>
    
    <input type="file" id="imageInput" accept="image/*">
    
    <label for="widthSelect">Lebar Maksimal:</label>
    <select id="widthSelect">
        <option value="800">Sedang (800 px)</option>
        <option value="1200" selected>Besar / HD (1200 px)</option>
        <option value="1920">Sangat HD (1920 px)</option>
    </select>
    
    <button id="processBtn">Proses & Unduh Foto</button>
    <div id="loading">Memproses foto agar tetap tajam...</div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const widthSelect = document.getElementById('widthSelect');
    const processBtn = document.getElementById('processBtn');
    const loading = document.getElementById('loading');

    processBtn.addEventListener('click', () => {
        const file = imageInput.files[0];
        if (!file) {
            alert('Silakan pilih foto terlebih dahulu!');
            return;
        }

        loading.style.display = 'block';
        processBtn.disabled = true;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const targetWidth = parseInt(widthSelect.value);
                
                let width = img.width;
                let height = img.height;
                if (width > targetWidth) {
                    height = Math.round((height * targetWidth) / width);
                    width = targetWidth;
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                
                // Mengaktifkan penghalusan gambar agar tidak pecah/pixelated
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                ctx.drawImage(img, 0, 0, width, height);

                // Ubah kualitas ke 0.95 (95%) agar ketajaman terjaga
                canvas.toBlob((blob) => {
                    loading.style.display = 'none';
                    processBtn.disabled = false;

                    if (!blob) {
                        alert('Gagal memproses gambar.');
                        return;
                    }

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'foto-jernih.jpg';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);

                    alert('Berhasil! Foto jernih telah diunduh.');
                }, 'image/jpeg', 0.95);
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });
</script>

</body>
</html>
