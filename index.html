<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Photo Enhancer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; box-sizing: border-box; }
        input[type="file"] { margin: 15px 0; width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #7c3aed; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background: #6d28d9; }
        #loading { display: none; margin-top: 15px; color: #555; font-weight: bold; }
        #resultContainer { margin-top: 20px; }
        img { max-width: 100%; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>✨ AI Photo Enhancer</h2>
    <p>Jernihkan foto buram dengan AI.</p>
    
    <input type="file" id="imageInput" accept="image/*">
    <button id="processBtn">Proses dengan AI ✨</button>
    
    <div id="loading">Sedang memproses AI, mohon tunggu sekitar 5-10 detik...</div>
    <div id="resultContainer"></div>
</div>

<script>
    // ==========================================
    // MASUKKAN API KEY DEEPAI ANDA DI DALAM TANDA KUTIP DI BAWAH INI:
    // ==========================================
    const DEEPAI_API_KEY = "52336f44-45d8-4909-944e-e7d8984cff35";

    const imageInput = document.getElementById('imageInput');
    const processBtn = document.getElementById('processBtn');
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('resultContainer');

    processBtn.addEventListener('click', async () => {
        const file = imageInput.files[0];

        if (!file) {
            alert('Silakan pilih foto terlebih dahulu!');
            return;
        }

        if (DEEPAI_API_KEY === "MASUKKAN_API_KEY_ANDA_DISINI" || !DEEPAI_API_KEY) {
            alert('Mohon masukkan API Key DeepAI di dalam kode script!');
            return;
        }

        loading.style.display = 'block';
        processBtn.disabled = true;
        resultContainer.innerHTML = '';

        const formData = new FormData();
        formData.append('image', file);

        try {
            const response = await fetch("https://api.deepai.org/api/torch-srgan", {
                method: 'POST',
                headers: {
                    'api-key': DEEPAI_API_KEY
                },
                body: formData
            });

            const textData = await response.text();
            let data;
            try {
                data = JSON.parse(textData);
            } catch (e) {
                throw new Error("Gagal membaca respons dari server AI.");
            }

            if (response.ok && data.output_url) {
                loading.style.display = 'none';
                processBtn.disabled = false;

                resultContainer.innerHTML = `
                    <h3>Hasil AI:</h3>
                    <img src="${data.output_url}" alt="Hasil Jernih AI"><br><br>
                    <a href="${data.output_url}" target="_blank" download="foto-jernih-ai.jpg" style="background: #059669; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold;">Unduh Foto Jernih</a>
                `;
            } else {
                throw new Error(data.error || 'Gagal memproses gambar dengan AI.');
            }
        } catch (error) {
            alert('Terjadi kesalahan: ' + error.message);
            loading.style.display = 'none';
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
